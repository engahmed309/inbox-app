<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var lang = localStorage.getItem('language') === 'en' ? 'en' : 'ar'
      document.documentElement.lang = lang
      document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl'
    })()
  </script>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#16161A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bridge" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Bridge</title>
</head>
<body class="bg-surface text-fg">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // حارس: لو بعد ١٢ ثانية مفيش حاجة اترسمت (ملف التطبيق الرئيسي نفسه فشل يتحمل، فكود React مش
    // هيشتغل أصلاً عشان يعرض أي رسالة) نعرض زرار يمسح الكاش ويحدّث
    setTimeout(function () {
      var root = document.getElementById('root')
      if (!root || root.childElementCount) return
      root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#16161A;color:#e5e7eb;text-align:center;font-family:sans-serif"><div><p style="font-size:16px;margin-bottom:8px">البرنامج مش بيفتح</p><p style="font-size:12px;color:#9ca3af;margin-bottom:16px">اضغط الزرار لتحديثه، من غير ما يخرّجك من حسابك</p><button id="fix" style="padding:10px 20px;border-radius:10px;border:0;background:#6366f1;color:#fff;font-size:14px">تحديث البرنامج</button></div></div>'
      document.getElementById('fix').onclick = function () {
        var done = function () { location.reload() }
        Promise.all([
          navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister() })) }) : 0,
          window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n) })) }) : 0
        ]).then(done, done)
      }
    }, 12000)
  </script>
</body>
</html>
